# ~/.aws/config. Set AWS_PROFILE=redshift-agent where the assistant starts and in each MCP server's configuration
# Role chaining caps the session at 1 hour; the AWS CLI and SDKs refresh it automatically
[profile redshift-agent]
role_arn = arn:aws:iam::111122223333:role/agent-redshift-readonly
source_profile = developer
duration_seconds = 3600
